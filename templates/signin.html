{% extends 'base.html' %}

{% block body %}

<div class="position-relative d-flex align-items-center justify-content-center"
     style="
     min-height: 100vh;
     overflow: hidden;
     background: linear-gradient(135deg, #111315, #191c1f, #22272b);
     ">

    <div class="position-absolute top-0 start-0 w-100 h-100"
         style="
         background:
         radial-gradient(circle at 20% 20%, rgba(139,92,246,0.18), transparent 35%),
         radial-gradient(circle at 80% 80%, rgba(167,139,250,0.12), transparent 35%);
         ">
    </div>


    <div class="position-relative"
         style="width: 90%; max-width: 500px;">

        <div class="card border-0 rounded-4 p-4 p-md-5"
             style="
             background: rgba(25, 28, 31, 0.88);
             backdrop-filter: blur(16px);
             -webkit-backdrop-filter: blur(16px);
             border: 1px solid rgba(255,255,255,0.1) !important;
             box-shadow: 0 8px 32px rgba(0,0,0,0.45) !important;
             ">


            <h2 class="mb-2 fw-bold text-white text-center">
                Sign In
            </h2>

            <p class="text-white-50 text-center mb-4">
                Welcome back to Hasnain's Digital Library
            </p>


            {% if messages %}

                {% for message in messages %}

                    <div class="alert alert-{{ message.tags }}"
                         role="alert">

                        {{ message }}

                    </div>

                {% endfor %}

            {% endif %}


            <form method="POST">

                {% csrf_token %}

                <input type="hidden"
                       name="next"
                       value="{{ request.GET.next }}">


                {{ form.as_p }}


                <button type="submit"
                        class="btn btn-primary btn-lg w-100 rounded-3 py-3 fw-bold"
                        style="
                        background-color: #8b5cf6;
                        border-color: #8b5cf6;
                        ">

                    Sign In

                </button>

            </form>


            <p class="text-white-50 text-center mt-4 mb-0">

                Don't have an account?

                <a href="{% url 'signup' %}"
                   class="fw-bold text-decoration-none"
                   style="color: #a78bfa;">

                    Sign Up

                </a>

            </p>


        </div>

    </div>

</div>

{% endblock body %}
