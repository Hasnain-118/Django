{% extends "base.html" %}
{% load i18n %}

{% block title %}Sign in with Google{% endblock %}

{% block body %}
<div class="container mt-5" style="color: #ffffff; max-width: 500px;">
    <h2 class="text-center mb-4">Sign in with Google</h2>

    <p class="text-center">
        {% blocktrans %}You are about to sign in using a third-party account from Google.{% endblocktrans %}
    </p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-primary w-100">
            Continue with Google
        </button>
    </form>

    <p class="text-center mt-3">
        <a href="{% url 'signin' %}" style="color: #b0b0b0;">Cancel and go back</a>
    </p>
</div>
{% endblock %}
