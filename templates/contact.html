{% extends "base.html" %}

{% block title %}Contact Us - Hasnain's Digital Library{% endblock title %}

{% block body %}

<div class="position-relative" style="min-height: calc(100vh - 70px); overflow: hidden;">

    <img src="/static/contact.jpg"
         class="w-100 h-100 position-absolute top-0 start-0"
         style="object-fit: cover;"
         alt="Contact us">

    <div class="position-absolute top-0 start-0 w-100 h-100"
         style="background: rgba(17, 19, 21, 0.72);">
    </div>

    <div class="position-relative d-flex align-items-center justify-content-center"
         style="min-height: calc(100vh - 70px); padding: 40px 15px;">

        <div class="card border-0 shadow-lg rounded-4 p-4"
             style="
                width: 100%;
                max-width: 600px;
                background: rgba(25, 28, 31, 0.88);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
             ">

            <h2 class="fw-bold text-white text-center mb-2">
                Contact Us
            </h2>

            <p class="text-center mb-4"
               style="color: #a1a1aa;">
                Have a question? We'd love to hear from you.
            </p>

            <form method="POST" action="/contact/">

                {% csrf_token %}

                <div class="mb-3">

                    <label for="name"
                           class="form-label fw-semibold text-white">
                        Full Name
                    </label>

                    <input type="text"
                           class="form-control form-control-lg contact-input"
                           id="name"
                           name="name"
                           placeholder="Enter your name">

                </div>


                <div class="mb-3">

                    <label for="email"
                           class="form-label fw-semibold text-white">
                        Email Address
                    </label>

                    <input type="email"
                           class="form-control form-control-lg contact-input"
                           id="email"
                           name="email"
                           placeholder="name@example.com"
                           required>

                    <div class="form-text"
                         style="color: #888;">
                        We'll never share your email.
                    </div>

                </div>


                <div class="mb-3">

                    <label for="phone"
                           class="form-label fw-semibold text-white">
                        Phone Number
                        <span style="color: #888;">(Optional)</span>
                    </label>

                    <input type="tel"
                           class="form-control form-control-lg contact-input"
                           id="phone"
                           name="phone"
                           placeholder="+92 300 1234567">

                </div>


                <div class="mb-4">

                    <label for="message"
                           class="form-label fw-semibold text-white">
                        Your Message
                    </label>

                    <textarea class="form-control form-control-lg contact-input"
                              id="message"
                              name="desc"
                              rows="4"
                              placeholder="Write your message here..."
                              required></textarea>

                </div>


                <button type="submit"
                        class="btn btn-lg w-100 rounded-3 py-3 fw-semibold contact-btn">

                    Send Message

                </button>

            </form>

        </div>

    </div>

</div>


<style>

    .contact-input {
        background: #22272b;
        border: 1px solid #3d444a;
        color: white;
    }

    .contact-input::placeholder {
        color: #777f87;
    }

    .contact-input:focus {
        background: #22272b;
        color: white;
        border-color: #8b5cf6;
        box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
    }

    .contact-btn {
        background: #8b5cf6;
        border: 1px solid #8b5cf6;
        color: white;
        transition: 0.2s ease;
    }

    .contact-btn:hover {
        background: #7c3aed;
        border-color: #7c3aed;
        color: white;
    }

</style>

{% endblock body %}
