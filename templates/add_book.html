{% extends 'base.html' %} 
 
{% block title %}Add Book - {% endblock title %} 
 
{% block body %} 
 
<div class="container mt-5"> 
 
    <h2 class="mb-4">Add New Book</h2> 
 
    <form method="POST" enctype="multipart/form-data"> 
 
        {% csrf_token %} 
 
        {{ form.as_p }} 
 
        <button type="submit" class="btn btn-success"> 
            Add Book 
        </button> 
 
        <a href="{% url 'home' %}" class="btn btn-secondary"> 
            Cancel 
        </a> 
 
    </form> 
 
</div> 
 
{% endblock body %}


<style>

    /* Page */

    body {
        background-color: #111315;
        color: #ffffff;
    }


    /* Main container */

    .container {
        max-width: 850px;
    }


    /* Heading */

    .container h2 {
        color: #ffffff;
        font-weight: 600;
        border-bottom: 1px solid #30343a;
        padding-bottom: 15px;
    }


    /* Form */

    form p {
        margin-bottom: 20px;
    }


    /* Labels */

    form label {
        display: block;
        color: #d1d5d8;
        font-weight: 500;
        margin-bottom: 7px;
    }


    /* Text inputs */

    form input[type="text"],
    form input[type="number"],
    form input[type="email"],
    form input[type="url"],
    form input[type="file"],
    form textarea,
    form select {
        width: 100%;
        background-color: #22272b;
        border: 1px solid #3d444a;
        color: #ffffff;
        border-radius: 8px;
        padding: 10px 12px;
        transition: 0.2s ease;
    }


    /* Textarea */

    form textarea {
        min-height: 120px;
        resize: vertical;
    }


    /* File input */

    form input[type="file"] {
        padding: 8px;
    }


    /* Focus */

    form input:focus,
    form textarea:focus,
    form select:focus {
        background-color: #22272b;
        color: #ffffff;
        border-color: #8b5cf6;
        outline: none;
        box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
    }


    /* Help text */

    form .helptext {
        display: block;
        color: #888f96;
        font-size: 0.85rem;
        margin-top: 5px;
    }


    /* Error messages */

    form .errorlist {
        color: #ff6b6b;
        margin: 5px 0;
        padding-left: 20px;
    }


    /* Add Book button */

    form .btn-success {
        background-color: #8b5cf6 !important;
        border-color: #8b5cf6 !important;
        color: #ffffff;
        border-radius: 8px;
        padding: 9px 20px;
        transition: 0.2s ease;
    }


    form .btn-success:hover {
        background-color: #7c3aed !important;
        border-color: #7c3aed !important;
    }


    /* Cancel button */

    form .btn-secondary {
        background-color: #22272b;
        border-color: #3d444a;
        color: #d1d5d8;
        border-radius: 8px;
        padding: 9px 20px;
        margin-left: 5px;
    }


    form .btn-secondary:hover {
        background-color: #30343a;
        border-color: #555b62;
        color: #ffffff;
    }


    /* Mobile */

    @media (max-width: 576px) {

        .container {
            margin-top: 30px !important;
        }

        form .btn {
            width: 100%;
            margin: 5px 0;
        }

        form .btn-secondary {
            margin-left: 0;
        }

    }

</style>
