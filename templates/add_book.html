{% extends 'base.html' %} 
 
{% block title %}Add Book - {% endblock title %} 
 
{% block body %} 
 
<div class="container mt-5"> 
 
    <h2 class="mb-4">Add New Book</h2> 
 
    <form method="POST" enctype="multipart/form-data"> 
 
        {% csrf_token %} 
 
        {{ form.as_p }} 
 
        <button type="submit" class="btn btn-success"> 
            Add Book 
        </button> 
 
        <a href="{% url 'home' %}" class="btn btn-secondary"> 
            Cancel 
        </a> 
 
    </form> 
 
</div> 
 

<style>

    /* =========================
       PAGE
    ========================= */

    body {
        background-color: #111315;
        color: #ffffff;
    }


    /* =========================
       MAIN CONTAINER
    ========================= */

    .container {
        max-width: 850px;
        padding-bottom: 50px;
    }


    /* =========================
       HEADING
    ========================= */

    .container h2 {
        color: #ffffff;
        font-weight: 700;
        border-bottom: 1px solid #30343a;
        padding-bottom: 15px;
        margin-bottom: 30px !important;
    }


    /* =========================
       FORM
    ========================= */

    form p {
        margin-bottom: 20px;
    }


    /* =========================
       LABELS
    ========================= */

    form label {
        display: block;
        color: #d1d5d8;
        font-weight: 600;
        margin-bottom: 8px;
    }


    /* =========================
       INPUTS
    ========================= */

    form input[type="text"],
    form input[type="number"],
    form input[type="email"],
    form input[type="url"],
    form input[type="file"],
    form textarea,
    form select {
        width: 100%;
        background-color: #22272b;
        border: 1px solid #3d444a;
        color: #ffffff;
        border-radius: 8px;
        padding: 11px 13px;
        transition: 0.2s ease;
    }


    /* =========================
       PLACEHOLDER
    ========================= */

    form input::placeholder,
    form textarea::placeholder {
        color: #777f87;
    }


    /* =========================
       TEXTAREA
    ========================= */

    form textarea {
        min-height: 120px;
        resize: vertical;
    }


    /* =========================
       FILE INPUT
    ========================= */

    form input[type="file"] {
        padding: 8px;
        cursor: pointer;
    }


    /* =========================
       SELECT
    ========================= */

    form select {
        cursor: pointer;
    }


    /* =========================
       FOCUS
    ========================= */

    form input:focus,
    form textarea:focus,
    form select:focus {
        background-color: #22272b;
        color: #ffffff;
        border-color: #8b5cf6;
        outline: none;
        box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
    }


    /* =========================
       HELP TEXT
    ========================= */

    form .helptext {
        display: block;
        color: #888f96;
        font-size: 0.85rem;
        margin-top: 6px;
    }


    /* =========================
       ERROR MESSAGES
    ========================= */

    form .errorlist {
        color: #ff6b6b;
        margin: 5px 0;
        padding-left: 20px;
    }


    /* =========================
       ADD BOOK BUTTON
    ========================= */

    form .btn-success {
        background-color: #8b5cf6 !important;
        border-color: #8b5cf6 !important;
        color: #ffffff;
        border-radius: 9px;
        padding: 9px 22px;
        transition: 0.2s ease;
    }


    form .btn-success:hover {
        background-color: #7c3aed !important;
        border-color: #7c3aed !important;
        transform: translateY(-1px);
    }


    /* =========================
       CANCEL BUTTON
    ========================= */

    form .btn-secondary {
        background-color: #22272b;
        border: 1px solid #3d444a;
        color: #d1d5d8;
        border-radius: 9px;
        padding: 9px 22px;
        margin-left: 5px;
        transition: 0.2s ease;
    }


    form .btn-secondary:hover {
        background-color: #30343a;
        border-color: #555b62;
        color: #ffffff;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 576px) {

        .container {
            margin-top: 30px !important;
            padding-left: 20px;
            padding-right: 20px;
        }

        form .btn {
            width: 100%;
            margin: 5px 0;
        }

        form .btn-secondary {
            margin-left: 0;
        }

    }

</style>


{% endblock body %}
