{% extends 'base.html' %}

{% block title %}Add Book - {% endblock title %}

{% block body %}

<style>

    /* =========================
       PAGE BACKGROUND
    ========================= */

    body {
        color: #ffffff;

        background-image:
            linear-gradient(
                rgba(17, 19, 21, 0.55),
                rgba(17, 19, 21, 0.65)
            ),
            url('/static/bg.jpg');

        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
    }


    /* =========================
       MAIN CONTAINER
    ========================= */

    .add-book-container {
        max-width: 850px;
        padding-bottom: 60px;
    }


    /* =========================
       GLASS FORM CARD
    ========================= */

    .add-book-card {
        background: rgba(25, 28, 31, 0.55);

        border: 1px solid rgba(255, 255, 255, 0.15);

        border-radius: 18px;

        padding: 35px;

        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);

        box-shadow:
            0 20px 50px rgba(0, 0, 0, 0.45),
            inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }


    /* =========================
       HEADING
    ========================= */

    .add-book-heading {
        color: #ffffff;
        font-weight: 700;
        margin-bottom: 8px;
    }


    .add-book-subtitle {
        color: #c0c4c8;
        margin-bottom: 30px;
        font-size: 0.95rem;
    }


    /* =========================
       FORM
    ========================= */

    .add-book-card form p {
        margin-bottom: 20px;
    }


    /* =========================
       LABELS
    ========================= */

    .add-book-card form label {
        display: block;
        color: #f0f0f0;
        font-weight: 600;
        margin-bottom: 8px;
    }


    /* =========================
       INPUTS
    ========================= */

    .add-book-card form input[type="text"],
    .add-book-card form input[type="number"],
    .add-book-card form input[type="email"],
    .add-book-card form input[type="url"],
    .add-book-card form input[type="file"],
    .add-book-card form textarea,
    .add-book-card form select {

        width: 100%;

        background: rgba(34, 39, 43, 0.78);

        border: 1px solid rgba(255, 255, 255, 0.15);

        color: #ffffff;

        border-radius: 9px;

        padding: 11px 13px;

        transition: 0.2s ease;
    }


    /* =========================
       PLACEHOLDER
    ========================= */

    .add-book-card form input::placeholder,
    .add-book-card form textarea::placeholder {
        color: #8d959c;
    }


    /* =========================
       TEXTAREA
    ========================= */

    .add-book-card form textarea {
        min-height: 120px;
        resize: vertical;
    }


    /* =========================
       FILE INPUT
    ========================= */

    .add-book-card form input[type="file"] {
        padding: 8px;
        cursor: pointer;
    }


    /* =========================
       FOCUS
    ========================= */

    .add-book-card form input:focus,
    .add-book-card form textarea:focus,
    .add-book-card form select:focus {

        background: rgba(34, 39, 43, 0.9);

        color: #ffffff;

        border-color: #8b5cf6;

        outline: none;

        box-shadow:
            0 0 0 3px rgba(139, 92, 246, 0.18);
    }


    /* =========================
       HELP TEXT
    ========================= */

    .add-book-card form .helptext {
        display: block;

        color: #a0a6ac;

        font-size: 0.85rem;

        margin-top: 6px;
    }


    /* =========================
       ERRORS
    ========================= */

    .add-book-card form .errorlist {
        color: #ff6b6b;

        margin: 5px 0;

        padding-left: 20px;
    }


    /* =========================
       BUTTONS
    ========================= */

    .add-book-actions {
        display: flex;
        gap: 10px;
        margin-top: 25px;
    }


    .add-book-btn {

        background-color: #8b5cf6 !important;

        border: 1px solid #8b5cf6 !important;

        color: #ffffff !important;

        border-radius: 9px;

        padding: 10px 22px;

        transition: 0.2s ease;
    }


    .add-book-btn:hover {

        background-color: #7c3aed !important;

        border-color: #7c3aed !important;

        transform: translateY(-1px);
    }


    .cancel-btn {

        background: rgba(34, 39, 43, 0.7) !important;

        border: 1px solid rgba(255, 255, 255, 0.15) !important;

        color: #d1d5d8 !important;

        border-radius: 9px;

        padding: 10px 22px;

        transition: 0.2s ease;
    }


    .cancel-btn:hover {

        background: rgba(48, 52, 58, 0.9) !important;

        color: #ffffff !important;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 576px) {

        .add-book-container {
            margin-top: 30px !important;
            padding-left: 15px;
            padding-right: 15px;
        }

        .add-book-card {
            padding: 25px 20px;
            border-radius: 14px;
        }

        .add-book-actions {
            flex-direction: column;
        }

        .add-book-btn,
        .cancel-btn {
            width: 100%;
        }

    }

</style>


<div class="container mt-5 add-book-container">

    <div class="add-book-card">

        <h2 class="add-book-heading">
            Add New Book
        </h2>

        <p class="add-book-subtitle">
            Add a new book to your digital library.
        </p>


        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            {{ form.as_p }}


            <div class="add-book-actions">

                <button type="submit" class="btn add-book-btn">
                    Add Book
                </button>

                <a href="{% url 'home' %}" class="btn cancel-btn">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>


{% endblock body %}
